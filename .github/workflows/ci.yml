name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs/google-classroom
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: libs/google-classroom/pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[lint,typing,test]"
      - name: Check formatting with ruff
        run: ruff format --check .
      - name: Lint with ruff
        run: ruff check .
      - name: Type check with mypy
        run: mypy .

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs/google-classroom
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: libs/google-classroom/pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[parsers,test]" pytest-cov
      - name: Run tests
        run: pytest tests/unit_tests/ -v --tb=short --disable-socket --allow-unix-socket --cov=langchain_google_classroom --cov-report=term-missing:skip-covered
